name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start SUT (mobile bank)
        run: |
          java -Duser.language=en -Duser.country=US -jar artifacts/app-mbank.jar &
          sleep 15

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test